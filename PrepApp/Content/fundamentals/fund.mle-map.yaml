    url: https://probml.github.io/pml-book/book1.html
    kind: book
    note: MAP as regularization, then the conjugate Beta, Dirichlet and Gaussian models, posterior predictive vs plug-in, and approximate inference.
  - title: "Bishop, Pattern Recognition and Machine Learning, §2.1–2.3 and §3.3"
    url: https://www.microsoft.com/en-us/research/publication/pattern-recognition-machine-learning/
    kind: book
    note: The Beta and Dirichlet derivations, Bayesian inference for the Gaussian, and Bayesian linear regression's predictive variance.
  - title: "Goodfellow, Bengio & Courville, Deep Learning, §5.6"
    url: https://www.deeplearningbook.org/contents/ml.html
    kind: book
    note: The Bayesian view in deep-learning terms, with Bayesian linear regression and MAP as weight decay.
  - title: "CS229 Lecture Notes, §9.4 Bayesian statistics and regularization"
    url: https://cs229.stanford.edu/main_notes.pdf
    kind: course
    note: A short derivation of full Bayesian prediction vs the MAP approximation.
