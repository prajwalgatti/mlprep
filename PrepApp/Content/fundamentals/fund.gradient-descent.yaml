    url: https://arxiv.org/abs/1606.04838
    kind: paper
    note: Clean proofs from the Lipschitz-gradient bound; §7 covers momentum and acceleration rates.
  - title: "Cohen et al. 2021, Gradient Descent on Neural Networks Typically Occurs at the Edge of Stability"
