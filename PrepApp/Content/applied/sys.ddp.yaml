  - title: "Li et al. 2020, PyTorch Distributed: Experiences on Accelerating Data Parallel Training, §3 and §5"
    url: https://arxiv.org/abs/2006.15704
    kind: paper
    note: The design of DDP from the people who built it. Bucketing, overlap, Algorithm 1, unused parameters, no_sync, and bucket-size measurements.
  - title: "PyTorch note: Distributed Data Parallel"
    url: https://docs.pytorch.org/docs/stable/notes/ddp.html
    kind: docs
    note: A short walkthrough of construction, forward, backward and the optimizer step, plus how DDP interacts with torch.compile (DDPOptimizer).
  - title: "Ultra-Scale Playbook: Data Parallelism"
    url: https://huggingface.co/spaces/nanotron/ultrascale-playbook
    kind: book
    note: Three optimisations (overlap, bucketing, accumulation) with Picotron code, the global batch-size equation, and measured scaling limits.
  - title: "How To Scale Your Model, Part 12: Rooflines for LLM Scaling on GPUs › Data Parallelism"
    url: https://jax-ml.github.io/scaling-book/gpus/
    kind: book
    note: The B/X > C/W derivation with H100 numbers (2,200 within a node, 2,475 across nodes) and the MoE E/k extension.
