  - title: "Salimans & Ho (2022), Progressive Distillation for Fast Sampling of Diffusion Models, §4 and App. D"
    url: https://arxiv.org/abs/2202.00512
    kind: paper
    note: Why ε-prediction breaks at low SNR, the x / (x, ε) / v options, the SNR and SNR+1 weightings, and the angular derivation of v.
  - title: "Kingma, Salimans, Poole & Ho (2021), Variational Diffusion Models, §3–5"
    url: https://arxiv.org/abs/2107.00630
    kind: paper
    note: The α/σ/SNR formulation, the discrete and continuous losses, and the proof that the ELBO depends only on the endpoint SNRs (§5.1).
  - title: "Kingma & Gao (2023), Understanding Diffusion Objectives as the ELBO with Simple Data Augmentation, §2–4"
    url: https://arxiv.org/abs/2303.00848
    kind: paper
    note: Table 1 rewrites ε, v, EDM and flow-matching losses as weightings w(λ); Theorem 1 links monotone weightings to the ELBO.
  - title: "Nichol & Dhariwal (2021), Improved Denoising Diffusion Probabilistic Models, §3.2"
    url: https://arxiv.org/abs/2102.09672
    kind: paper
    note: The cosine schedule, the evidence that the linear schedule wastes its noisiest steps, and the ᾱ_t comparison plot.
  - title: "Luo (2022), Understanding Diffusion Models, \"Three Equivalent Interpretations\" (p.15–17)"
    url: https://arxiv.org/abs/2208.11970
