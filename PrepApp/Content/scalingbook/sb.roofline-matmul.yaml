  - id: f8
    type: open
    source: Scaling Book ch. 1 (Rooflines) §"Matrix multiplication"
    front: Derive the critical batch size for a bf16 matmul on a TPU v5e, and state the assumptions.
    back: |
      - FLOPs $2BDF$; bytes $2BD + 2DF + 2BF$.
      - $I = BDF/(BD + DF + BF)$. Assume $B \ll D, F$ (per-chip batch ≲ 1k tokens; $D, F$ ≳ 8k): $I \approx B$.
      - Compute-bound iff $I > C/W = 1.97\times10^{14}/8.2\times10^{11} \approx 240$, so $B > 240$.
      - Interpretation: weights dominate bytes and each is reused across $B$ tokens.
      - Caveats: $B$ is tokens per replica; small $D, F$ raise the exact threshold (≈ 450 at 1024); precision changes it ($B_\text{crit} = (C/W)\,b_w/2$).
  - id: f9
    type: open
    source: 'Scaling Book ch. 1 (Rooflines), Question 2; Scaling Book ch. 7 §"Linear operations: what bottlenecks us?"'
    front: Explain to an interviewer why weight-only int8 quantization speeds up small-batch LLM inference even though the math stays in bf16.
    back: |
      - At small batch, matmuls are bandwidth-bound: time ≈ weight bytes / HBM bandwidth.
      - int8 weights halve those bytes, so memory-bound steps get up to 2× faster.
      - Intensity becomes $2BDF/DF = 2B$, so $B_\text{crit}$ falls from 240 to 120 on a v5e: compute-bound at half the batch.
      - The math is unchanged (bf16 FLOPs at bf16 peak), which avoids low-precision-arithmetic accuracy issues; weights are dequantized on the fly.
      - Contrast: int8 math too keeps $B_\text{crit}$ at 240, since peak doubles as bytes halve.
  - id: f10
    type: open
    source: Scaling Book ch. 1 (Rooflines), Question 4; Scaling Book ch. 7 §"What about attention?"
    front: Why can't batching make a per-example matmul, such as decode attention over KV caches, compute-bound?
    back: |
      - Batching helps only when tokens share operands: one weight load serves $B$ tokens.
      - With per-example matrices ($[B, D]\cdot[B, D, F]$), bytes $\approx BDF$ and FLOPs $2BDF$: intensity ≈ 2, independent of $B$.
      - In decode attention each sequence reads its own KV cache, so the same structure holds: intensity ≈ 1 FLOP/byte for MHA.
      - Bigger batches add proportionally more bytes; the only levers are fewer bytes (GQA/MQA, KV quantization) or faster memory.
  - id: f11
    type: open
    source: Scaling Book ch. 1 (Rooflines) §"Network communication rooflines"
    front: For the two-chip contraction-split matmul, derive the compute-bound condition and explain why it depends on D but not B.
    back: |
      - Each chip does half the FLOPs: $T_\text{math} = 2BDF/(2C) = BDF/C$.
      - Each sends its $[B, F]$ bf16 partial sum: $T_\text{comms} = 2BF/W$.
      - Ratio: $T_\text{math}/T_\text{comms} = DW/(2C)$, so compute-bound iff $D > 2C/W \approx 8755$ (v5e, 4.5e10 B/s).
      - $B$ and $F$ scale both FLOPs and bytes shipped, so they cancel. $D$ measures how much local work goes into each output element that must be sent.

