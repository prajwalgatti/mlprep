name: PrepApp
options:
  bundleIdPrefix: io.github.prajwalgatti
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
packages:
  Yams:
    url: https://github.com/jpsim/Yams
    from: "5.1.0"
  LaTeXSwiftUI:
    url: https://github.com/colinc86/LaTeXSwiftUI
    from: "2.0.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  PrepApp:
    type: application
    platform: iOS
    sources:
      - path: PrepApp
        type: syncedFolder
    dependencies:
      - package: Yams
      - package: LaTeXSwiftUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).PrepApp
        PRODUCT_NAME: PrepApp
        INFOPLIST_KEY_CFBundleDisplayName: Prep
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Terminal AppIcon-Editorial AppIcon-Schmidhuber"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  PrepAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PrepAppTests
        type: syncedFolder
    dependencies:
      - target: PrepApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PrepApp.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/PrepApp"
  PrepAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PrepAppUITests
        type: syncedFolder
    dependencies:
      - target: PrepApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PrepApp
schemes:
  PrepApp:
    build:
      targets:
        PrepApp: all
    test:
      targets:
        - PrepAppTests
        - PrepAppUITests
